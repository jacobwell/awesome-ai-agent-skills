name: Validate skills

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate catalog
        run: python scripts/validate_skills.py

      - name: Run Production Agent Stack demo
        run: python demos/production-agent-stack/run_demo.py --check --no-color
